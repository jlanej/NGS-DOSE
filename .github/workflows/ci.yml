name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"          # weekly: dependencies move even when the repository does not
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12", lint: true }
          - { os: ubuntu-latest, python: "3.10" }          # the oldest Python the package claims to support
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # rust-htslib generates its htslib bindings with bindgen, which needs libclang at build time
          sudo apt-get install -y --no-install-recommends samtools clang libclang-dev pkg-config cmake zlib1g-dev libbz2-dev liblzma-dev libcurl4-openssl-dev libssl-dev

      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: brew install samtools xz

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Lint once, and not on the weekly run: a new compiler's new lints are not a regression of ours
      - name: Engine - format and lints
        if: matrix.lint && github.event_name != 'schedule'
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets --locked -- -D warnings

      - name: Engine - build
        run: cargo build --release --locked

      - name: Engine - unit tests
        run: cargo test --release --locked

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Python package
        run: pip install -e ".[dev]"

      # defects only (undefined and unused names, syntax, bugbear); configured in pyproject.toml
      - name: Python - lints
        if: matrix.lint
        run: ruff check ngsdose tests example resources/build

      # data-free simulation of the estimator, cohort calibration and trio statistics
      - name: Model self-test
        run: ngsdose selftest

      # unit tests, the simulated-genome end-to-end test (engine + estimator against known truth),
      # real 1000 Genomes reads, a mock trio cohort through the cohort layer, and the regression
      # tests on the pilot's counts
      - name: pytest
        run: pytest -v
