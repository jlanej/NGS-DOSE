name: Container

# ghcr.io/<owner>/ngs-dose: the engine, the ngsdose package, the GRCh38 bundle and aria2c -
# everything a cluster run needs besides Apptainer, SLURM and the cohort's own scripts (NGS-DOSE-1000G).
#   every push to main  ->  :latest and :sha-<commit>
#   every tag vX.Y.Z    ->  :X.Y.Z and :X.Y
#   pull requests       ->  built and smoke-tested, not pushed
# On a cluster:  apptainer pull ngs-dose.sif docker://ghcr.io/<owner>/ngs-dose:latest
# (GitHub creates a package private: make it public once, under the package's settings, for
#  that pull to need no login.)
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ngs-dose

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: NGSDOSE_BUILD=${{ github.sha }}
          tags: ngs-dose:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # what is pushed has counted real reads and estimated from them
      - name: Smoke test inside the image
        run: |
          docker run --rm ngs-dose:test ngs-dose --version
          docker run --rm ngs-dose:test ngsdose selftest
          docker run --rm -v "$PWD/tests/data:/data:ro" ngs-dose:test sh -c \
            'ngs-dose count -m fetch -i /data/NA12878.subsample.bam -p $NGSDOSE_RESOURCES/panel.k31.tsv.gz -c $NGSDOSE_RESOURCES/controls.fa.gz --sinks $NGSDOSE_RESOURCES/sinks.bed -o /tmp/c.json.gz && ngsdose estimate /tmp/c.json.gz'

      # the image under Apptainer, as a cluster runs it: the engine counts real reads from the fixture and
      # the package estimates from them. The cohort pipeline that drives this on a cluster lives with the
      # cohort (NGS-DOSE-1000G), whose own CI runs it against the published image.
      - uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6
      - name: Under Apptainer
        run: |
          set -euo pipefail
          apptainer build "$RUNNER_TEMP/ngs-dose.sif" docker-daemon://ngs-dose:test
          apptainer exec "$RUNNER_TEMP/ngs-dose.sif" aria2c --version | head -1
          apptainer exec --bind "$PWD/tests/data:/data:ro" "$RUNNER_TEMP/ngs-dose.sif" sh -c \
            'ngs-dose count -m fetch -i /data/NA12878.subsample.bam -p $NGSDOSE_RESOURCES/panel.k31.tsv.gz -c $NGSDOSE_RESOURCES/controls.fa.gz --sinks $NGSDOSE_RESOURCES/sinks.bed -o /tmp/c.json.gz && ngsdose estimate /tmp/c.json.gz -t -' | cut -f1-3

      # only main and version tags publish; everything else stops at the smoke test
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: NGSDOSE_BUILD=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
